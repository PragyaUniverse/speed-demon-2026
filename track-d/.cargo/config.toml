# x86-64-v3 is exactly what the scoring CPU offers (AVX2, BMI2, no AVX-512), whichever machine builds.
# Static linking skips the dynamic loader, which is measurable when the whole run takes milliseconds.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static"]
